name: SaaS release gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL migrations and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triagem_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: triagem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triagem_test -d triagem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --locked --extra dev
      - name: Validate real PostgreSQL migrations, locking and cascade
        run: uv run --locked --extra dev pytest tests/test_postgres.py --no-cov -q --junitxml=work/postgres-results.xml
        env:
          TRIAGEM_TEST_POSTGRES_URL: postgresql+psycopg://triagem_test:disposable-ci-password@127.0.0.1:5432/triagem_test
          TRIAGEM_ENV: development
          TRIAGEM_WORKER_MODE: disabled
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-results
          path: work/postgres-results.xml
          retention-days: 14
          if-no-files-found: ignore

  docker-smoke:
    name: Docker image and same-origin application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build production image from locked dependencies
        run: docker build --pull --tag triagem-ci:${{ github.sha }} .
      - name: Start isolated smoke container
        run: >-
          docker run --detach --name triagem-smoke
          --publish 127.0.0.1:8000:8000
          --env TRIAGEM_ENV=staging
          --env TRIAGEM_WORKER_MODE=embedded
          --env GEMINI_API_KEY=
          --env JOOBLE_API_KEY=
          --env ADZUNA_APP_ID=
          --env ADZUNA_API_KEY=
          --env TRIAGEM_PUBLIC_URL=http://localhost:8000
          --env TRIAGEM_JWT_SECRET=ci-only-disposable-secret-8f9c31a22bb44708ae74135d207629ef
          triagem-ci:${{ github.sha }}
      - name: Verify readiness, frontend assets, API routing and non-root user
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker exec triagem-smoke id -u)" != "0"
          python3 - <<'PY'
          import json
          import re
          import time
          from http.client import HTTPException
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          base = 'http://127.0.0.1:8000'
          deadline = time.monotonic() + 90
          while True:
              try:
                  with urlopen(base + '/ready', timeout=5) as response:
                      assert json.load(response)['status'] == 'ready'
                  break
              except (URLError, OSError, HTTPException, AssertionError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(2)
          with urlopen(base + '/', timeout=5) as response:
              assert response.headers.get_content_type() == 'text/html'
              html = response.read().decode()
          assert 'id="root"' in html
          assets = re.findall(r'(?:src|href)="(/assets/[^"<>]+)"', html)
          assert assets, 'Built frontend assets are missing'
          for asset in assets:
              with urlopen(base + asset, timeout=5) as response:
                  assert response.status == 200 and response.read()
          for path in ('/api/not-found', '/billing/not-found'):
              try:
                  urlopen(base + path, timeout=5)
                  raise AssertionError(f'{path} must return 404 instead of SPA HTML')
              except HTTPError as error:
                  assert error.code == 404
          with urlopen(base + '/api/config/publico', timeout=5) as response:
              assert json.load(response)['nome_servico']
          print('Readiness, frontend/assets and API boundaries verified.')
          PY
      - name: Verify persisted queue runs in an isolated process without provider credentials
        shell: bash
        run: |
          docker exec -i triagem-smoke python - <<'PY'
          import time
          from api.database import BuscaDB, PerfilDB, SessionLocal, Usuario
          from triagem.perfil_usuario import PerfilUsuario

          with SessionLocal() as db:
              usuario = Usuario(email='smoke@example.test', senha_hash='unused-test-fixture')
              db.add(usuario)
              db.flush()
              perfil = PerfilUsuario(nome='Smoke', consentimento_ia=True, onboarding_concluido=True)
              db.add(PerfilDB(usuario_id=usuario.id, dados=perfil.model_dump(),
                             cv_base='Experiência com Python em projetos de automação.'))
              tarefa = BuscaDB(usuario_id=usuario.id, pedido='Python', limite=1)
              db.add(tarefa)
              db.commit()
              identificador = tarefa.id
          limite = time.monotonic() + 60
          while time.monotonic() < limite:
              with SessionLocal() as db:
                  tarefa = db.get(BuscaDB, identificador)
                  if tarefa.estado == 'falhou':
                      assert tarefa.iniciada_em and tarefa.concluida_em and tarefa.worker_token
                      assert 'Não foi possível concluir' in tarefa.erro
                      print('Persisted task claimed and handled by isolated worker without API credentials.')
                      break
              time.sleep(1)
          else:
              raise AssertionError('Embedded worker did not claim and finish persisted task')
          PY
      - name: Verify migrations are safe on container restart
        shell: bash
        run: |
          set -euo pipefail
          docker restart triagem-smoke
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/ready
      - name: Container logs
        if: failure()
        run: docker logs triagem-smoke
      - name: Remove isolated smoke container
        if: always()
        run: docker rm --force triagem-smoke || true
