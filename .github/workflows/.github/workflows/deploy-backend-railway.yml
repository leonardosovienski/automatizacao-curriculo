name: Deploy Backend to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Railway deploy
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Deploying to Railway..."
          npm install -g railway
          railway login --apiKey "$RAILWAY_TOKEN"
          # The following command assumes the repo is linked; if not, use the Railway dashboard to link the project
          railway up --detach --project "$RAILWAY_PROJECT_ID"
      - name: Deploy instructions
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "No RAILWAY_TOKEN secret found. To enable automatic deploys, add repository secrets: RAILWAY_TOKEN, RAILWAY_PROJECT_ID. Or connect the repo in Railway dashboard for automatic deployments."
