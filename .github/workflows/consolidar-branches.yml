name: Concluir consolidacao das branches

# Limpeza pontual solicitada pelo mantenedor na PR #60. Não é uma política
# geral de exclusão: somente estes dois nomes e os commits revisados são aceitos.
on:
  push:
    branches: [main]
    paths: [.github/workflows/consolidar-branches.yml]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'leonardosovienski/automatizacao-curriculo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove only reviewed branches already contained in main
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess
          from urllib.request import Request, urlopen

          repository = 'leonardosovienski/automatizacao-curriculo'
          request = Request(
              f'https://api.github.com/repos/{repository}/pulls/60',
              headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                       'Accept': 'application/vnd.github+json'},
          )
          with urlopen(request, timeout=30) as response:
              pr = json.load(response)
          assert pr['merged'] and pr['base']['ref'] == 'main'
          assert pr['head']['repo']['full_name'] == repository
          assert pr['head']['ref'] == 'codex/saas-production-readiness'
          expected = {
              'codex/saas-production-readiness': pr['head']['sha'],
              'dependabot/npm_and_yarn/frontend/frontend-minor-patch-2a10eea5ae':
                  'c3f8865b21a80d0b470dc47ccea538cb727cab3a',
          }
          remote = subprocess.check_output(
              ['git', 'ls-remote', '--heads', 'origin'], text=True,
          )
          refs = dict(line.split()[::-1] for line in remote.splitlines())
          leases, deletions = [], []
          for branch, sha in expected.items():
              ref = 'refs/heads/' + branch
              if ref not in refs:
                  print(f'{branch}: already absent')
                  continue
              assert refs[ref] == sha, f'{branch}: changed since review; preserving branch'
              subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
              leases.append(f'--force-with-lease={ref}:{sha}')
              deletions.append(':' + ref)
          if deletions:
              # Leases reject a concurrent push after validation; atomic prevents
              # partial removal. No wildcard, default branch or unrelated ref.
              subprocess.run(['git', 'push', '--atomic', *leases, 'origin', *deletions], check=True)
          print('Reviewed branches consolidated in main; cleanup complete.')
