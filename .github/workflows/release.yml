name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev]"

      - name: Validate tag against project version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          expected_version = tag.removeprefix("v")

          with pathlib.Path("pyproject.toml").open("rb") as file:
              project = tomllib.load(file)

          actual_version = project["project"]["version"]

          if actual_version != expected_version:
              raise SystemExit(
                  f"Tag {tag!r} does not match pyproject.toml "
                  f"version {actual_version!r}"
              )

          print(f"Release version validated: {actual_version}")

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Test wheel installation
        run: |
          python -m venv release-test
          release-test/bin/python -m pip install dist/*.whl
          release-test/bin/triar --help

      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: python-package-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v7
        with:
          name: python-package-${{ github.ref_name }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
