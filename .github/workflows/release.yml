name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"

      - name: Validate tag against project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          expected_version = tag.removeprefix("v")

          with pathlib.Path("pyproject.toml").open("rb") as file:
              project = tomllib.load(file)

          actual_version = project["project"]["version"]

          if actual_version != expected_version:
              raise SystemExit(
                  f"Tag {tag!r} does not match pyproject.toml "
                  f"version {actual_version!r}"
              )

          print(f"Release version validated: {actual_version}")

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Test wheel installation
        run: |
          python -m venv release-test
          release-test/bin/python -m pip install dist/*.whl
          release-test/bin/triar --help

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: python-package-${{ github.run_id }}
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then

            echo "Release ${GITHUB_REF_NAME} already exists. Uploading artifacts."

            gh release upload "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            echo "Creating release ${GITHUB_REF_NAME}."

            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
