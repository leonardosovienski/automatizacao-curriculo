# Verificação de ponta a ponta contra a API real do Gemini.
#
# A suíte de testes cobre a orquestração com um cliente falso, o que valida
# retry, paralelismo e persistência — mas não o CONTRATO com o google-genai:
# se o structured output ainda casa com o schema AnaliseVaga, e se o formato
# de erro/cota é o que o código espera. Se o SDK mudar, o `pytest` continua
# verde e o problema só aparece em uso real.
#
# Este workflow fecha essa lacuna no único lugar onde a chave existe sem sair
# de um cofre: os Repository secrets, que só o Actions enxerga. É manual
# (workflow_dispatch) de propósito — cada execução gasta chamadas pagas, então
# não roda sozinho a cada push.
name: Verificação Gemini (manual)

on:
  workflow_dispatch:
  # TEMPORÁRIO — `workflow_dispatch` só aparece depois que o arquivo está na
  # main. Este gatilho existe para conseguir a primeira execução ainda na
  # branch; deve ser removido antes do merge, senão cada push gasta cota.
  push:
    branches: [claude/wonderful-ride-ldjj2d]

permissions:
  contents: read

jobs:
  analisar-lote-real:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Confirmar que a chave chegou ao runner
        env:
          GEMINI_API_KEY: ${{ secrets.APIKEYGEMINI }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::O secret APIKEYGEMINI está vazio ou não existe neste repositório."
            exit 1
          fi
          echo "Chave presente (${#GEMINI_API_KEY} caracteres). Valor nunca é impresso."

      - name: Analisar o lote de exemplo com a API real
        env:
          # O código lê GEMINI_API_KEY; o secret foi cadastrado como APIKEYGEMINI.
          # O mapeamento fica aqui para não exigir renomear o secret.
          GEMINI_API_KEY: ${{ secrets.APIKEYGEMINI }}
        run: python triar.py analisar exemplos/vagas_exemplo.txt

      - name: Conferir que o resultado foi persistido no histórico
        run: python triar.py historico

      - name: Publicar o histórico gerado como artefato
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: historico-verificacao
          path: historico.json
          retention-days: 7
          if-no-files-found: warn
