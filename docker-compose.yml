services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triagem
      POSTGRES_PASSWORD: ${TRIAGEM_POSTGRES_PASSWORD:?Defina TRIAGEM_POSTGRES_PASSWORD no .env}
      POSTGRES_DB: triagem
    volumes:
      - triagem-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagem"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://triagem:${TRIAGEM_POSTGRES_PASSWORD}@db/triagem
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  triagem-db:
