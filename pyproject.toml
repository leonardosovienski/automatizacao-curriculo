[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagem-vagas"
version = "1.0.0"
description = "CLI personalizado para triagem de vagas com Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "ddgs>=9.14",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
triar = "triagem.cli:main"

[tool.setuptools.packages.find]
include = ["triagem*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
