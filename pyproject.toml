[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagem-vagas"
version = "1.0.1"
description = "CLI personalizado para triagem de vagas com Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.17,<3",
    "ddgs>=9.14,<10",
    "filelock>=3.32,<4",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<1",
]

[project.scripts]
triar = "triagem.cli:main"

[tool.setuptools.packages.find]
include = ["triagem*"]

[tool.setuptools.package-data]
triagem = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=triagem --cov=api --cov-branch --cov-fail-under=75"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
